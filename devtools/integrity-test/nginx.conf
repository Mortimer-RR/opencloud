# reverse proxy with nginx's defaults (request buffering on) and a short read timeout
server {
    listen 80;
    client_max_body_size 0;
    proxy_read_timeout 5s;

    location / {
        proxy_pass https://opencloud.test:9200;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name opencloud.test;
        proxy_set_header Host opencloud.test:9200;
        proxy_set_header X-Forwarded-Proto https;
        # tus Location headers point at the server, send the client back through the proxy
        proxy_redirect https://opencloud.test:9200/ http://nginx/;
    }
}
